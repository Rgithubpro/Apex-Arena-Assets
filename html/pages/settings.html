<div id="settings-screen" class="page">
    <img id="settings-screen-background" data-asset="assets/backgrounds/background.png" alt="">
    <button type="button" id="settings-screen-back-button" aria-label="Back to home">← Back</button>

    <div id="settings-screen-account">
        <p id="settings-screen-account-name"></p>
        <button type="button" id="settings-screen-logout-button" hidden>Log out</button>
        <input type="password" id="settings-screen-delete-password" placeholder="Enter your password to confirm" autocomplete="current-password" hidden>
        <button type="button" id="settings-screen-delete-button" hidden>Delete account</button>
        <p id="settings-screen-account-note"></p>
    </div>
</div>
